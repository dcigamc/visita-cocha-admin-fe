<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 py-2">
  <div class="flex flex-col gap-1">
    <label for="name" class="font-medium text-sm text-gray-700">Nombre</label>
    <input 
      id="name" 
      type="text" 
      pInputText 
      formControlName="name" 
      placeholder="Ej. Naturaleza"
      class="w-full">
    @if (form.get('name')?.invalid && form.get('name')?.touched) {
      <small class="text-red-500">El nombre es requerido</small>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="icon" class="font-medium text-sm text-gray-700">Icono</label>
    <p-select 
      id="icon"
      formControlName="icon" 
      [options]="ionIcons" 
      optionLabel="label" 
      optionValue="value"
      placeholder="Seleccionar icono"
      [filter]="true"
      filterBy="label,value"
      [virtualScroll]="true"
      [virtualScrollItemSize]="38"
      appendTo="body"
      class="w-full">
      <ng-template pTemplate="selectedItem" let-selectedOption>
        @if (selectedOption) {
          <div class="flex items-center gap-2">
            <ion-icon [name]="selectedOption.value" class="text-lg"></ion-icon>
            <div>{{ selectedOption.label }}</div>
          </div>
        }
      </ng-template>
      <ng-template pTemplate="item" let-icon>
        <div class="flex items-center gap-2">
          <ion-icon [name]="icon.value" class="text-lg"></ion-icon>
          <div>{{ icon.label }}</div>
        </div>
      </ng-template>
    </p-select>
  </div>

  <!-- Campo de Imagen -->
  <div class="flex flex-col gap-2">
    <label class="font-medium text-sm text-gray-700">Imagen / Banner (Opcional)</label>
    
    @if (photoPreview()) {
      <div class="relative w-full h-32 rounded-lg overflow-hidden border border-slate-200 group shadow-sm">
        <img [src]="photoPreview()" class="w-full h-full object-cover" alt="Previsualización">
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
          <p-button icon="pi pi-trash" [rounded]="true" severity="danger" (onClick)="removePhoto()"></p-button>
        </div>
      </div>
    } @else {
      <div 
        class="w-full h-32 rounded-lg border-2 border-dashed border-slate-200 bg-slate-50 hover:bg-slate-100 transition-all flex flex-col items-center justify-center gap-2 cursor-pointer text-slate-400"
        (click)="fileInput.click()">
        <i class="pi pi-image text-2xl"></i>
        <span class="text-[10px] font-bold uppercase">Subir Imagen</span>
      </div>
    }
    <input #fileInput type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)">
  </div>

  <div class="flex flex-col gap-1">
    <label for="order" class="font-medium text-sm text-gray-700">Orden de Visualización</label>
    <p-inputNumber 
      id="order" 
      formControlName="order" 
      [showButtons]="true" 
      buttonLayout="horizontal" 
      spinnerMode="horizontal" 
      [min]="0"
      decrementButtonClass="p-button-secondary"
      incrementButtonClass="p-button-secondary"
      incrementButtonIcon="pi pi-plus" 
      decrementButtonIcon="pi pi-minus"
      class="w-full">
    </p-inputNumber>
    <small class="text-grey-500 text-[10px] font-bold italic">
      Los números menores aparecen primero en la lista (ej: 0 es el primero).
    </small>
  </div>

  <div class="flex items-center gap-2 mt-2">
    <p-toggleswitch formControlName="available" id="available"></p-toggleswitch>
    <label for="available" class="font-medium text-sm text-gray-700 cursor-pointer">Disponible</label>
  </div>

  <div class="flex justify-end gap-2 mt-6">
    <p-button 
      label="Cancelar" 
      severity="secondary" 
      [outlined]="true"
      (onClick)="cancel()">
    </p-button>
    <p-button 
      [label]="categoryToEdit() ? 'Actualizar' : 'Guardar'" 
      type="submit" 
      [loading]="isLoading()"
      [disabled]="form.invalid">
    </p-button>
  </div>
</form>
