<div class="flex h-screen bg-slate-50 overflow-hidden">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl">
    <div class="p-6 flex items-center gap-3 border-b border-slate-800">
      <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center">
        <i class="pi pi-map text-white font-bold"></i>
      </div>
      <h2 class="text-xl font-bold text-white tracking-tight">Visita Cocha</h2>
    </div>

    <!-- User Profile Snippet -->
    <div class="px-6 py-4 bg-slate-800/50 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold border border-slate-600">
        {{ user()?.displayName?.charAt(0) || 'U' }}
      </div>
      <div class="overflow-hidden">
        <p class="text-sm font-semibold text-white truncate">{{ user()?.displayName }}</p>
        <p class="text-xs text-slate-400 capitalize">{{ userRoleLabel() }}</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1 custom-scrollbar">
      @for (item of menuItems; track item.label) {
        <a 
          [routerLink]="item.routerLink" 
          routerLinkActive="bg-blue-600/10 text-blue-400 border-l-4 border-blue-500"
          class="flex items-center gap-3 px-3 py-2.5 rounded-md transition-all hover:bg-slate-800 hover:text-white group"
        >
          <i [class]="item.icon + ' text-lg transition-transform group-hover:scale-110'"></i>
          <span class="font-medium text-sm">{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Logout -->
    <div class="p-4 border-t border-slate-800">
      <button 
        (click)="logout()"
        class="flex items-center gap-3 w-full px-3 py-2.5 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-md transition-colors group"
      >
        <i class="pi pi-sign-out text-lg"></i>
        <span class="font-medium text-sm">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col min-w-0">
    <!-- Content Wrapper -->
    <div class="flex-1 overflow-y-auto p-8 custom-scrollbar bg-slate-50">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>

<style>
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #475569;
  }
</style>
